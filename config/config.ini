[service]
AppModel = debug
HttpPort = :8080

[postgresql]
DB = mydb
DbHost = 127.0.0.1
DbPort = 5432
DbUser = postgres
DbPassword = root
DbName = rag

[jwt]
Secret = rag-dev-secret-change-me-in-prod
ExpireHours = 72

[storage]
UploadDir = ./uploads
MaxFileSizeMB = 50
AllowedTypes = pdf,md,txt,docx

[milvus]
Address = 127.0.0.1:19530
Collection = rag_chunks

[embedding]
; Provider: dashscope | mock（mock 用于无 key 时打通流水线）
Provider = dashscope
BaseURL = https://dashscope.aliyuncs.com/compatible-mode/v1
Model = text-embedding-v3
Dim = 1024
; API key 从环境变量 DASHSCOPE_API_KEY 读取，不写在此文件
ChunkSize = 500
ChunkOverlap = 80

[llm]
; Provider: dashscope | mock（mock 用于无 key 时联调 SSE 链路）
Provider = dashscope
BaseURL = https://dashscope.aliyuncs.com/compatible-mode/v1
Model = qwen-plus
; 检索返回的片段数量（RAG 上下文条数）
QueryTopK = 5
; API key 复用环境变量 DASHSCOPE_API_KEY，不写在此文件